<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>姓名貼排版工具 (支援自訂字體上傳)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+TC:wght@700&family=Noto+Serif+TC:wght@700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">

<style>
  body { font-family: sans-serif; display: flex; flex-wrap: wrap; margin: 20px; background-color: #f4f4f9; gap: 20px; }
  .controls { width: 340px; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); height: fit-content; }
  .preview-container { flex-grow: 1; border: 1px solid #ccc; background: #999; padding: 20px; text-align: center; overflow: auto; max-height: 90vh; border-radius: 8px; min-width: 300px; }
  
  canvas { 
    background-color: #ffffff;
    background-image: 
      linear-gradient(45deg, #e0e0e0 25%, transparent 25%), 
      linear-gradient(-45deg, #e0e0e0 25%, transparent 25%), 
      linear-gradient(45deg, transparent 75%, #e0e0e0 75%), 
      linear-gradient(-45deg, transparent 75%, #e0e0e0 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4); 
    width: 100%; 
    max-width: 100%; 
    height: auto; 
    transition: max-width 0.3s ease; 
  }
  
  label { display: block; margin-top: 15px; font-weight: bold; font-size: 14px;}
  input[type="text"], input[type="number"], input[type="file"], select { width: 90%; margin-top: 5px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
  input[type="color"] { width: 100%; height: 40px; padding: 2px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; margin: 0; box-sizing: border-box;}
  
  .color-row { display: flex; align-items: center; gap: 10px; margin-top: 5px; width: 90%; }
  .checkbox-label { margin-top: 0; font-weight: normal; cursor: pointer; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  
  .input-group { display: flex; align-items: center; gap: 8px; margin-top: 5px; width: 90%; }
  .input-group input { width: 50%; margin-top: 0; }
  
  .slider-group { display: flex; align-items: center; gap: 5px; margin-top: 5px; width: 95%; font-size: 13px; font-weight: normal; color: #555;}
  .slider-group input[type="range"] { flex-grow: 1; cursor: pointer; margin: 0 5px; }

  button { width: 100%; font-size: 16px; font-weight: bold; padding: 12px; margin-top: 20px; border: none; border-radius: 4px; cursor: pointer; transition: 0.2s; }
  .btn-download { background: #008CBA; color: white; margin-top: 10px; }
  .btn-download:hover { background: #007bb5; }
  #statusText { font-size: 14px; color: #d32f2f; font-weight: bold; margin-top: 15px; line-height: 1.5; background: #ffebee; padding: 10px; border-radius: 4px; }
</style>
</head>
<body>
  <div class="controls">
    <h2 style="margin-top: 0;">姓名貼產生器</h2>
    
    <label>1. 紙張大小: 
      <select id="paperSize" onchange="generate()">
        <option value="A4">A4 (210 x 297 mm)</option>
        <option value="A5">A5 (148 x 210 mm)</option>
        <option value="Special">特殊尺寸 (300 x 255 mm)</option>
      </select>
    </label>

    <label>2. 輸出底色 (整張畫布): 
      <div class="color-row">
        <input type="color" id="paperBgColor" value="#ffffff" onchange="generate()" oninput="generate()">
        <label class="checkbox-label">
          <input type="checkbox" id="paperTransparent" onchange="generate()"> 透明去背
        </label>
      </div>
    </label>

    <label>3. 貼紙底色 (單張貼紙): 
      <div class="color-row">
        <input type="color" id="stickerBgColor" value="#f0f4f8" onchange="generate()" oninput="generate()">
        <label class="checkbox-label">
          <input type="checkbox" id="stickerTransparent" onchange="generate()"> 透明
        </label>
      </div>
    </label>

    <label>4. 背景圖片 (可多選): 
      <input type="file" id="bgImages" accept="image/*" multiple>
    </label>
    
    <label>5. 上傳自訂字體 (.ttf / .otf): 
      <input type="file" id="fontFile" accept=".ttf,.otf">
    </label>

    <label>6. 中文姓名與排版: 
      <input type="text" id="zhName" value="王小明" oninput="generate()">
      <div class="slider-group">
        大小 <input type="range" id="zhSize" min="10" max="80" value="42" oninput="generate()">
      </div>
      <div class="slider-group">
        上下 <input type="range" id="zhPosY" min="10" max="90" value="38" oninput="generate()">
      </div>
    </label>
    
    <label>7. 英文姓名與排版: 
      <input type="text" id="enName" value="Ming Wang" oninput="generate()">
      <div class="slider-group">
        大小 <input type="range" id="enSize" min="10" max="60" value="25" oninput="generate()">
      </div>
      <div class="slider-group">
        上下 <input type="range" id="enPosY" min="10" max="90" value="75" oninput="generate()">
      </div>
    </label>

    <label>8. 共同設定 (顏色/字體): 
      <div class="color-row">
        <input type="color" id="textColor" value="#333333" onchange="generate()" oninput="generate()">
      </div>
      <select id="fontFamily" onchange="generate()" style="margin-top:8px;">
        <option value="'Noto Sans TC', sans-serif">思源黑體 (Google Fonts)</option>
        <option value="'Noto Serif TC', serif">思源宋體 (Google Fonts)</option>
        <option value="'Ma Shan Zheng', cursive">馬善政毛筆體 (Google Fonts)</option>
        <option value="'ZCOOL KuaiLe', cursive">站酷快樂體 (Google Fonts)</option>
        <option value='sans-serif'>系統預設黑體</option>
      </select>
    </label>
    
    <label>9. 貼紙尺寸 (寬 x 高 cm): 
      <div class="input-group">
        <input type="number" id="widthCm" value="3" step="0.1" oninput="generate()">
        <span style="font-weight: normal; font-size: 12px;">x</span>
        <input type="number" id="heightCm" value="1.3" step="0.1" oninput="generate()">
      </div>
    </label>

    <label>10. 裁切間距 (左右 x 上下 mm): 
      <div class="input-group">
        <input type="number" id="spacingX" value="10" step="1" oninput="generate()">
        <span style="font-weight: normal; font-size: 12px;">x</span>
        <input type="number" id="spacingY" value="6" step="1" oninput="generate()">
      </div>
    </label>

    <button id="downloadBtn" class="btn-download" onclick="download()">下載列印圖檔</button>
    
    <div id="statusText">載入中...</div>
  </div>
  
  <div class="preview-container">
    <canvas id="previewCanvas"></canvas>
  </div>

<script>
  let loadedImages = [];
  let customFontName = 'CustomUploadedFont';

  // 處理自訂字體上傳
  document.getElementById('fontFile').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = async function(event) {
      try {
        const fontBuffer = event.target.result;
        const fontFace = new FontFace(customFontName, fontBuffer);
        await fontFace.load();
        document.fonts.add(fontFace);

        // 自動將選單切換到剛上傳的自訂字體
        const select = document.getElementById('fontFamily');
        
        // 檢查選單中是否已經存在自訂選項，沒有的話就新增一個
        let customOption = document.querySelector('option[value="CustomUploadedFont"]');
        if (!customOption) {
          customOption = document.createElement('option');
          customOption.value = customFontName;
          select.insertBefore(customOption, select.firstChild);
        }
        customOption.text = `自訂字體: ${file.name}`;
        select.value = customFontName;

        generate();
        alert(`字體「${file.name}」載入成功！`);
      } catch (err) {
        alert("字體載入失敗，請確認上傳的是有效的 .ttf 或 .otf 檔案。");
        console.error(err);
      }
    };
    reader.readAsArrayBuffer(file);
  });

  document.getElementById('bgImages').addEventListener('change', function(e) {
    const files = Array.from(e.target.files);
    loadedImages = new Array(files.length);
    let loadedCount = 0;

    if (files.length === 0) {
      loadedImages = [];
      generate();
      return;
    }

    files.forEach((file, index) => {
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = () => {
          loadedImages[index] = img; 
          loadedCount++;
          if (loadedCount === files.length) {
            generate();
          }
        };
        img.src = event.target.result;
      }
      reader.readAsDataURL(file);
    });
  });

  const DPI = 300;
  const MM_PER_INCH = 25.4;
  
  const PAPER_DIMENSIONS = {
    'A4': { width: 210, height: 297 },
    'A5': { width: 148, height: 210 },
    'Special': { width: 300, height: 255 } 
  };

  function mmToPx(mm) { 
    return Math.round((mm / MM_PER_INCH) * DPI); 
  }

  async function generate() {
    await document.fonts.ready;

    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');

    const paperSize = document.getElementById('paperSize').value;
    const paperBgColor = document.getElementById('paperBgColor').value;
    const isPaperTransparent = document.getElementById('paperTransparent').checked;
    
    const paperWidthPx = mmToPx(PAPER_DIMENSIONS[paperSize].width);
    const paperHeightPx = mmToPx(PAPER_DIMENSIONS[paperSize].height);
    
    canvas.width = paperWidthPx;
    canvas.height = paperHeightPx;

    if (paperSize === 'A5') {
      canvas.style.maxWidth = '70%';
    } else {
      canvas.style.maxWidth = '100%';
    }

    if (isPaperTransparent) {
      ctx.clearRect(0, 0, paperWidthPx, paperHeightPx);
      document.getElementById('downloadBtn').innerText = "下載列印圖檔 (去背 PNG)";
    } else {
      ctx.fillStyle = paperBgColor;
      ctx.fillRect(0, 0, paperWidthPx, paperHeightPx);
      document.getElementById('downloadBtn').innerText = "下載列印圖檔 (彩色底 PNG)";
    }

    const wCm = parseFloat(document.getElementById('widthCm').value) || 3;
    const hCm = parseFloat(document.getElementById('heightCm').value) || 1.3;
    const stickerWidthPx = mmToPx(wCm * 10);
    const stickerHeightPx = mmToPx(hCm * 10);

    const zhName = document.getElementById('zhName').value;
    const enName = document.getElementById('enName').value;
    const textColor = document.getElementById('textColor').value;
    const fontFamily = document.getElementById('fontFamily').value;
    
    const stickerBgColor = document.getElementById('stickerBgColor').value;
    const isStickerTransparent = document.getElementById('stickerTransparent').checked;

    const zhSizePct = parseFloat(document.getElementById('zhSize').value) / 100;
    const zhPosYPct = parseFloat(document.getElementById('zhPosY').value) / 100;
    const enSizePct = parseFloat(document.getElementById('enSize').value) / 100;
    const enPosYPct = parseFloat(document.getElementById('enPosY').value) / 100;

    const spacingXPx = mmToPx(parseFloat(document.getElementById('spacingX').value) || 0);
    const spacingYPx = mmToPx(parseFloat(document.getElementById('spacingY').value) || 0);
    const minMarginX = mmToPx(10); 
    const minMarginY = mmToPx(10); 

    let cols = Math.floor((paperWidthPx - minMarginX * 2 + spacingXPx) / (stickerWidthPx + spacingXPx));
    let rows = Math.floor((paperHeightPx - minMarginY * 2 + spacingYPx) / (stickerHeightPx + spacingYPx));
    
    if (cols < 1) cols = 1;
    if (rows < 1) rows = 1;
    const totalStickers = cols * rows;

    const actualGridWidth = cols * stickerWidthPx + (cols - 1) * spacingXPx;
    const actualGridHeight = rows * stickerHeightPx + (rows - 1) * spacingYPx;
    
    const startX = (paperWidthPx - actualGridWidth) / 2;
    const startY = (paperHeightPx - actualGridHeight) / 2;

    document.getElementById('statusText').innerHTML = 
      `📂 紙張：${document.getElementById('paperSize').options[document.getElementById('paperSize').selectedIndex].text}<br>` + 
      `📐 像素：${paperWidthPx} x ${paperHeightPx} px<br>` +
      `🏷️ 排版：左右 ${cols} 行 x 上下 ${rows} 列 (共 ${totalStickers} 張)`;

    const zhFontSize = stickerHeightPx * zhSizePct;
    const enFontSize = stickerHeightPx * enSizePct;

    for (let r = 0; r < rows; r++) {
      const stickerCanvas = document.createElement('canvas');
      stickerCanvas.width = stickerWidthPx;
      stickerCanvas.height = stickerHeightPx;
      const sCtx = stickerCanvas.getContext('2d');

      if (!isStickerTransparent) {
         sCtx.fillStyle = stickerBgColor;
         sCtx.fillRect(0, 0, stickerWidthPx, stickerHeightPx);
      }

      if (loadedImages.length > 0) {
         const currentImg = loadedImages[r % loadedImages.length];
         sCtx.drawImage(currentImg, 0, 0, stickerWidthPx, stickerHeightPx);
      }

      sCtx.textAlign = 'center';
      sCtx.textBaseline = 'middle'; 
      sCtx.fillStyle = textColor;
      
      sCtx.font = `bold ${zhFontSize}px ${fontFamily}`;
      sCtx.fillText(zhName, stickerWidthPx / 2, stickerHeightPx * zhPosYPct);
      
      sCtx.font = `bold ${enFontSize}px Arial, ${fontFamily}`;
      sCtx.fillText(enName, stickerWidthPx / 2, stickerHeightPx * enPosYPct);
      
      sCtx.strokeStyle = 'rgba(0,0,0,0.1)';
      sCtx.lineWidth = 1;
      sCtx.strokeRect(0, 0, stickerWidthPx, stickerHeightPx);

      for (let c = 0; c < cols; c++) {
        const x = startX + c * (stickerWidthPx + spacingXPx);
        const y = startY + r * (stickerHeightPx + spacingYPx);
        ctx.drawImage(stickerCanvas, x, y);
      }
    }
  }

  function download() {
    const canvas = document.getElementById('previewCanvas');
    const paperSize = document.getElementById('paperSize').value;
    const isPaperTransparent = document.getElementById('paperTransparent').checked;
    const link = document.createElement('a');
    
    const suffix = isPaperTransparent ? '_Transparent' : '_ColorBg';
    link.download = `NameStickers_${paperSize}${suffix}.png`;
    
    link.href = canvas.toDataURL('image/png', 1.0);
    link.click();
  }

  window.onload = () => setTimeout(generate, 100);
</script>
</body>
</html>
